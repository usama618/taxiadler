<a class="skip-link" href="#hauptinhalt">Zum Inhalt springen</a>
<f:cObject typoscriptObjectPath="lib.adlerGlobal" data="{siteRoot: siteRoot, colPos: 91}" />
<main id="hauptinhalt"><f:render section="Main" /></main>
<f:cObject typoscriptObjectPath="lib.adlerGlobal" data="{siteRoot: siteRoot, colPos: 92}" />
<div class="mobile-fixed-actions">
  <f:if condition="{siteHeader.phoneHref}"><a href="{siteHeader.phoneHref}"><span class="cms-icon" data-icon="phone" aria-hidden="true"></span>Anrufen</a></f:if>
  <f:link.typolink parameter="{siteHeader.adler_primary_link}">{siteHeader.adler_primary_label}</f:link.typolink>
</div>
<f:cObject typoscriptObjectPath="lib.whatsappSticky" data="{link: siteHeader.adler_whatsapp}" />
<dialog class="privacy-dialog" id="privacy-dialog" aria-labelledby="privacy-dialog-title" data-privacy-dialog>
  <header class="privacy-dialog__header">
    <h2 id="privacy-dialog-title">Datenschutzhinweise</h2>
    <button type="button" class="privacy-dialog__close" data-privacy-close autofocus aria-label="Datenschutzhinweise schließen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
  </header>
  <div class="privacy-dialog__content legal-copy" data-privacy-content></div>
  <footer class="privacy-dialog__footer"><a data-privacy-page-link target="_blank" rel="noopener noreferrer">Datenschutzerklärung als Seite öffnen</a></footer>
</dialog>
<button type="button" class="back-to-top" data-back-to-top tabindex="-1" aria-label="Zurück nach oben"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v14"/></svg><span>OBEN</span></button>
