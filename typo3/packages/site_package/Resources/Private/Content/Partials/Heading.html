<f:if condition="{data.adler_eyebrow}"><div class="section-label"><span class="section-label-bar"></span>{data.adler_eyebrow}</div></f:if>
<f:if condition="{data.header}"><h2>{data.header}<f:if condition="{data.adler_accent}"><br/><em>{data.adler_accent}</em></f:if></h2></f:if>
<f:if condition="{data.bodytext} && !{hideBody}"><div class="editorial-copy"><f:format.html>{data.bodytext}</f:format.html></div></f:if>
