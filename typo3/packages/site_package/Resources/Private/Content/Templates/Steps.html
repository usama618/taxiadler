<f:render partial="Anchor" arguments="{_all}"/>
<section class="steps-section" id="c{data.uid}"><div class="steps-ambient" aria-hidden="true"></div><div class="container-wide steps-container"><div class="steps-intro"><div class="steps-heading"><f:render partial="Heading" arguments="{data:data,hideBody:1}"/></div><div class="steps-lead"><f:format.html>{data.bodytext}</f:format.html></div></div>
<div class="steps-track" aria-hidden="true"><svg viewBox="0 0 1200 42" preserveAspectRatio="none"><path class="steps-track-base" d="M0 21 H1200"/><path class="steps-track-active" d="M0 21 H1200"/></svg><f:for each="{items}" as="item" iteration="i"><span class="track-point" style="left:{i.index * 33.333}%"></span></f:for></div>
<div class="steps-list"><f:for each="{items}" as="item" iteration="i"><article class="step-card"><div class="step-top"><span class="step-icon"><f:render partial="Icon" arguments="{name:item.icon}"/></span><span class="step-no">SCHRITT 0{i.cycle}</span></div><div class="step-visual"><f:if condition="{item.imageFile}"><f:image image="{item.imageFile}" width="920" loading="lazy" alt="{f:if(condition:item.imageFile.alternative,then:item.imageFile.alternative,else:item.title)}"/></f:if><span class="step-visual-label">0{i.cycle}</span><span class="step-visual-sheen" aria-hidden="true"></span></div><div class="step-body"><span class="step-kicker">{item.eyebrow}</span><h3>{item.title}</h3><f:format.html>{item.description}</f:format.html><f:if condition="{item.link}"><f:link.typolink parameter="{item.link}">{item.link_label}</f:link.typolink></f:if></div><span class="step-corner" aria-hidden="true"><f:render partial="Icon" arguments="{name:'arrow-up-right'}"/></span></article></f:for></div>
<div class="steps-bottom"><p class="steps-disclaimer"><f:render partial="Icon" arguments="{name:'shield-check'}"/><span>{data.adler_note}</span></p><f:render partial="TextButton" arguments="{_all}"/></div></div></section>
