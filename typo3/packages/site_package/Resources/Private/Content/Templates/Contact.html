<f:render partial="Anchor" arguments="{_all}"/>
<section class="cms-contact-priority" id="c{data.uid}">
  <aside class="contact-direct"><div class="contact-phone-top"><span class="contact-phone-symbol"><f:render partial="Icon" arguments="{name:'phone'}"/></span><h2>{data.header}</h2><a class="contact-direct-number" href="{siteHeader.phoneHref}">{siteHeader.adler_phone}<f:render partial="Icon" arguments="{name:'arrow-up-right'}"/></a><span class="contact-open"><span></span>{siteHeader.adler_hours}</span></div><div class="contact-phone-bottom"><f:format.html>{data.bodytext}</f:format.html><f:if condition="{siteHeader.adler_whatsapp}"><f:link.typolink parameter="{siteHeader.adler_whatsapp}" target="_blank" class="btn btn-outline" additionalAttributes="{rel:'noopener noreferrer'}"><f:render partial="Icon" arguments="{name:'whatsapp'}"/>{data.adler_primary_label}</f:link.typolink></f:if><p>{data.adler_note}</p></div></aside>
</section>
<div class="container-wide contact-secondary cms-contact-secondary"><div class="contact-secondary-links"><a href="{siteHeader.mobileHref}"><f:render partial="Icon" arguments="{name:'phone'}"/>{siteHeader.adler_mobile}</a><a href="mailto:{siteHeader.adler_email}"><f:render partial="Icon" arguments="{name:'mail'}"/>{siteHeader.adler_email}</a></div><details class="contact-address"><summary><f:render partial="Icon" arguments="{name:'map-pin'}"/>{data.adler_secondary_label}<f:render partial="Icon" arguments="{name:'chevron-down'}"/></summary><div><address>{siteHeader.adler_address}</address></div></details></div>
