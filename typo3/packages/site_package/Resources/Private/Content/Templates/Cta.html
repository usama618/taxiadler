<f:render partial="Anchor" arguments="{_all}"/>
<section class="contact-section" id="c{data.uid}"><f:if condition="{files.0}"><div class="contact-photo" style="background-image:url('{f:uri.image(image: files.0)}')" aria-hidden="true"></div><f:render partial="ImageDisclosure" arguments="{label:imageDisclosure}"/></f:if><div class="container-wide contact-layout"><div><f:render partial="Heading" arguments="{_all}"/></div><div class="contact-actions"><f:if condition="{data.adler_primary_link}"><f:link.typolink parameter="{data.adler_primary_link}" class="contact-number"><span><f:render partial="Icon" arguments="{name:'phone'}"/></span>{data.adler_primary_label}<f:render partial="Icon" arguments="{name:'arrow-up-right'}"/></f:link.typolink></f:if><f:if condition="{data.adler_secondary_link}"><f:link.typolink parameter="{data.adler_secondary_link}" class="btn btn-outline" target="_blank" additionalAttributes="{rel:'noopener noreferrer'}"><f:render partial="Icon" arguments="{name:secondaryIcon}"/>{data.adler_secondary_label}</f:link.typolink></f:if><f:if condition="{data.adler_tertiary_link}"><f:link.typolink parameter="{data.adler_tertiary_link}" class="btn btn-gold">{data.adler_tertiary_label}<f:render partial="Icon" arguments="{name:'arrow-up-right'}"/></f:link.typolink></f:if></div></div></section>
