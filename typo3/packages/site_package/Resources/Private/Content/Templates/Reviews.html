<f:render partial="Anchor" arguments="{_all}"/>
<section class="google-reviews-section" id="c{data.uid}"><div class="container-wide"><div class="google-reviews-layout"><div class="google-reviews-intro"><f:render partial="Heading" arguments="{_all}"/></div><div class="google-reviews-source"><span class="reviews-source-symbol"><f:render partial="Icon" arguments="{name:'message-circle'}"/></span><div class="reviews-source-copy"><span class="reviews-source-label">{data.adler_source_label}</span><div class="google-rating-summary"><strong>{ratingFormatted}<small> / 5</small></strong><span>aus {data.adler_count} Bewertungen</span></div><f:link.typolink parameter="{data.adler_source_link}" class="text-link" target="_blank" additionalAttributes="{rel: 'noopener noreferrer'}">{data.adler_source_label}<f:render partial="Icon" arguments="{name:'arrow-up-right'}"/></f:link.typolink></div></div></div><p class="reviews-selection-label">{data.adler_note}</p>
<div class="review-carousel" data-review-carousel data-autoplay="{data.adler_autoplay}" data-interval="{data.adler_interval}" role="region" aria-roledescription="Karussell" aria-label="{data.header}"><div class="google-review-cards" tabindex="0"><f:for each="{items}" as="item"><figure class="google-review-card"><div class="review-stars" aria-label="{item.rating} von 5 Sternen"><f:for each="{0:1,1:2,2:3,3:4,4:5}" as="star"><f:if condition="{star} <= {item.rating}"><span aria-hidden="true">★</span></f:if></f:for></div><blockquote><f:format.html>{item.description}</f:format.html></blockquote><figcaption><strong>{item.title}</strong><f:link.typolink parameter="{item.link}" target="_blank" additionalAttributes="{rel: 'noopener noreferrer'}">Auf Google lesen</f:link.typolink></figcaption></figure></f:for></div><div class="review-carousel-controls"><div class="review-carousel-arrows"><button type="button" data-prev aria-label="Vorherige Bewertungen">←</button><button type="button" data-next aria-label="Nächste Bewertungen">→</button></div><div class="review-carousel-dots"></div><button type="button" data-pause class="review-carousel-pause" aria-label="Automatischen Wechsel pausieren" aria-pressed="false">Pause</button></div></div>
</div></section>
